name: Bajas de futbol (API-Football)

on:
  schedule:
    - cron: '17 */2 * * *'   # cada 2 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  bajas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traer la rama de datos
        run: |
          git fetch origin data || true
          if git rev-parse --verify -q origin/data >/dev/null; then
            git worktree add data origin/data
          else
            git worktree add --detach data && (cd data && git checkout --orphan data && git rm -rf -q . || true)
          fi
          mkdir -p data/bajas
      - name: Pedir bajas
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: node scripts/bajas.mjs data/bajas
      - name: Guardar
        if: always()
        run: |
          cd data
          git config user.name "altoq-bot"
          git config user.email "altoq-bot@users.noreply.github.com"
          git add -A bajas
          git diff --cached --quiet && exit 0
          git commit -q -m "Bajas $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:data
