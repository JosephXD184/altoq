<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ALTOQ</title>
  <meta name="description" content="ALTOQ · probabilidades del modelo y cuotas en tiempo real.">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=9">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('rushtop:theme')||'dark'}catch(e){}</script>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#" aria-label="ALTOQ"><img class="logo-on-dark" src="logo.svg" alt="ALTOQ"><img class="logo-on-light" src="logo-dark.svg" alt="ALTOQ"></a>
      <div class="top-r">
        <nav class="seg" id="leagues">
          <button data-liga="nba" class="on">NBA</button>
          <button data-liga="nfl">NFL</button>
          <button data-liga="fc">FC</button>
        </nav>
        <button class="icon-btn" id="themeBtn" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
        </button>
        <button class="acc-btn" id="accountBtn" data-act="account">Crear cuenta</button>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- Login -->
    <section id="login" class="card login hidden">
      <h1 class="brand big"><img class="logo-on-dark" src="logo.svg" alt="ALTOQ"><img class="logo-on-light" src="logo-dark.svg" alt="ALTOQ"></h1>
      <p class="mut">Crea tu cuenta gratis y desbloquea todo el análisis.</p>
      <div class="seg wide2">
        <button data-auth="login" id="tabLogin">Entrar</button>
        <button data-auth="signup" id="tabSignup" class="on">Crear cuenta</button>
      </div>
      <form id="authForm" class="aform" novalidate>
        <label id="nameRow">Nombre<input id="aName" autocomplete="name" placeholder="Tu nombre"></label>
        <label>Correo<input id="aEmail" type="email" autocomplete="email" placeholder="tu@correo.com" required></label>
        <label id="passRow">Contraseña<input id="aPass" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" minlength="6"></label>
        <button class="btn google" type="submit" id="aSubmit">Crear cuenta gratis</button>
        <button class="linkbtn" type="button" data-act="reset" id="resetBtn">¿Olvidaste tu contraseña?</button>
      </form>
      <div class="or"><span>o</span></div>
      <button class="btn ghost" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continuar con Google
      </button>
      <p class="err hidden" id="loginErr"></p>
      <p class="ok hidden" id="loginOk"></p>
      <button class="linkbtn" data-act="guest">Seguir como invitado (acceso limitado)</button>
      <p class="tiny mut hidden" id="localNote">Modo de prueba: falta configurar Firebase, así que la cuenta solo existe en este navegador.</p>
      <p class="tiny mut">Tus apuestas y tu boleto son privados: solo los ves tú. +18. Juega con responsabilidad.</p>
    </section>

    <!-- App -->
    <section id="app" class="hidden">
      <div class="status" id="status"></div>
      <div id="view"></div>
    </section>
  </main>

  <!-- Barra inferior: iconos dibujados en SVG (no dependen de la codificación) -->
  <nav class="tabs hidden" id="tabs">
    <button data-tab="hoy" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Hoy</button>
    <button data-tab="props"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Props</button>
    <button data-tab="valor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Picks</button>
    <button data-tab="boleto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v4a3 3 0 0 0 0 6v4H4v-4a3 3 0 0 0 0-6z"/><path d="M10 9h4M10 15h4"/></svg>Boleto <i id="slipCount"></i></button>
    <button data-tab="perfil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5c1.2-2 3.2-3 5.5-3s4.3 1 5.5 3"/></svg>Perfil</button>
  </nav>

  <!-- ?v= obliga al navegador a bajar la versión nueva tras cada publicación -->
  <script src="config.js?v=9"></script>
  <script type="module" src="app.js?v=9"></script>
</body>
</html>
